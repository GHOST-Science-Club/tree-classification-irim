name: GPU - Train Model, push logs to Wandb

on:
    workflow_dispatch:

jobs:
    build:
        permissions: write-all
        runs-on: ubuntu-22.04
        environment: Repository

        steps:
            -   uses: actions/checkout@v6

            -   name: Install uv
                uses: astral-sh/setup-uv@v5
                with:
                    enable-cache: true

            -   name: Set up Python
                run: uv python install 3.11

            -   uses: iterative/setup-cml@v3

            -   name: Install lightning-sdk
                run: |
                    uv venv
                    uv pip install lightning-sdk

            -   name: Post config.yaml in PR comment
                continue-on-error: true
                env:
                    REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    echo "## Model was built using Config" >> config-indented.md
                    sed 's/  /\&nbsp;\&nbsp;/g' ./src/config.yaml > config-indented.md
                    cml comment update --watermark-title='GPU {workflow} config' config-indented.md

            -   name: Start lightning.ai studio and train model there
                run: |
                    uv run --no-sync python -c 'import os, re
                    from lightning_sdk import Studio, Machine

                    user = os.environ.get("LIGHTNING_AI_USERNAME")
                    branch = os.environ.get("GITHUB_REF_NAME", "main")
                    branch_studio_name = re.sub("[^a-zA-Z0-9-]", "-", branch)[:30]

                    studio = Studio(name=branch_studio_name, teamspace="Vision-model", user=user)
                    studio.start(Machine.T4)

                    try:
                        studio.run_with_exit_code("rm -rf tree-classification-irim")
                        studio.run_with_exit_code(f"git clone --single-branch --branch {branch} https://github.com/GHOST-Science-Club/tree-classification-irim.git")
                        studio.run_with_exit_code("pip install uv && uv python install 3.11 && uv python pin 3.11")
                        studio.run_with_exit_code("cd tree-classification-irim && uv sync && uv run dvc repro")
                    finally:
                        studio.stop()
                        studio.delete()'

                env:
                    LIGHTNING_AI_USERNAME: ${{ secrets.LIGHTNING_AI_USERNAME }}
                    LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
                    LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
                    WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
