name: Linting & Formatting Check

on:
    pull_request:

permissions:
    contents: read

jobs:
    ruff-linting:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: astral-sh/ruff-action@v3
                with:
                    version-file: "pyproject.toml"
    ruff-formatting:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: astral-sh/ruff-action@v3
                with:
                    version-file: "pyproject.toml"
                    args: "format --check --diff"
