name: Mypy Type Check

on:
    pull_request:

permissions:
    contents: read

jobs:
    mypy:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ ubuntu-latest ]
                python-version: [ '3.10' ]

        steps:
            -   uses: actions/checkout@v6
            -   name: Install uv
                uses: astral-sh/setup-uv@v5
                with:
                    enable-cache: true
            -   name: Set up Python ${{ matrix.python-version }}
                run: uv python install ${{ matrix.python-version }}
            -   name: Run mypy tests
                run: uv run mypy
