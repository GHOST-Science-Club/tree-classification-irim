[tox]
minversion = 4.0.0
env_list = py{311}-{linux,windows}
isolated_build = true

[gh-actions]
python =
    3.11: py311

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    windows-latest: windows

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps = 
    pytest
    pytest-cov
    linux: -r {toxinidir}/unix-requirements.txt
    windows: -r {toxinidir}/requirements.txt
commands =
    pytest
